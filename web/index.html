<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Swimbase Test</title>
</head>
<body>
  <h1>Swimbase Frontend</h1>
  <button onclick="loadData()">API laden</button>
  <pre id="output"></pre>

  <script>
    async function loadData() {
      try {
        // Render API Endpoint (ändern falls nötig)
        const response = await fetch("https://swimbase.onrender.com/");
        const data = await response.json();
        document.getElementById("output").textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById("output").textContent = "Fehler: " + err;
      }
    }
  </script>
</body>
</html>
